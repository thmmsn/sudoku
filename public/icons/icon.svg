<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon master. PNGs are rendered from this by tools/make-icons.mjs. -->
  <defs>
    <radialGradient id="spot" cx="50%" cy="47%" r="60%">
      <stop offset="0" stop-color="#5e9ae6" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#5e9ae6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5e9ae6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8fb3e0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="digit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc2f5"/>
    </linearGradient>
    <linearGradient id="dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d3f5"/>
      <stop offset="1" stop-color="#4f86cf"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.37  0 0 0 0 0.6  0 0 0 0 0.9  0 0 0 0.95 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="box"><rect x="88" y="88" width="336" height="336" rx="34"/></clipPath>
    <!-- A monoline 9 in a 100x100 box. -->
    <path id="nine" d="M71 39a21 21 0 1 1-42 0a21 21 0 1 1 42 0C71 66 60 84 36 88" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <rect id="bg" width="512" height="512" rx="116" fill="#000"/>
  <rect width="512" height="512" rx="116" fill="url(#spot)"/>

  <g id="mark">
    <!-- the two other 9s, marked like on the board -->
    <g clip-path="url(#box)">
      <rect x="312" y="88" width="112" height="112" fill="#5e9ae6" fill-opacity="0.13"/>
      <rect x="88" y="312" width="112" height="112" fill="#5e9ae6" fill-opacity="0.13"/>
    </g>
    <use href="#nine" transform="translate(333 109) scale(0.7)" stroke="url(#dim)" stroke-width="9" opacity="0.8"/>
    <use href="#nine" transform="translate(109 333) scale(0.7)" stroke="url(#dim)" stroke-width="9" opacity="0.8"/>

    <!-- selected centre cell -->
    <rect x="200" y="200" width="112" height="112" fill="#5e9ae6" fill-opacity="0.2"/>
    <rect x="201.5" y="201.5" width="109" height="109" fill="none" stroke="#8fb3e0" stroke-opacity="0.7" stroke-width="3"/>

    <!-- grid: box of 3x3 -->
    <path d="M200 88V424M312 88V424M88 200H424M88 312H424" stroke="url(#line)" stroke-width="3"/>
    <rect x="88" y="88" width="336" height="336" rx="34" fill="none" stroke="url(#edge)" stroke-width="4"/>

    <!-- the glowing 9 -->
    <use href="#nine" transform="translate(206 204) scale(1)" stroke="url(#digit)" stroke-width="10" filter="url(#glow)"/>
  </g>

  <!-- light catching the top edge of the tile -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#edge)" stroke-width="3" opacity="0.6"/>
</svg>
